version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockpulse-postgres
    restart: always
    environment:
      POSTGRES_DB: stockpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-<POSTGRES_PASSWORD_REDACTED>}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockpulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockpulse-backend
    restart: always
    environment:
      PROJECT_NAME: "StockPulse AI"
      ENVIRONMENT: "production"
      DEBUG: "False"
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-<POSTGRES_PASSWORD_REDACTED>}@postgres:5432/stockpulse"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-<JWT_SECRET_KEY_REDACTED>}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      RATE_LIMIT_PER_MINUTE: "120"
      AUTH_RATE_LIMIT_PER_MINUTE: "20"
      DB_POOL_SIZE: "15"
      DB_MAX_OVERFLOW: "30"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - stockpulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockpulse-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - stockpulse-net

volumes:
  postgres_data:
    driver: local

networks:
  stockpulse-net:
    driver: bridge

