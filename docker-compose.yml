version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stockpulse-backend:latest
    container_name: stockpulse-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROJECT_NAME: "StockPulse AI"
      ENVIRONMENT: "demo"
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      RATE_LIMIT_PER_MINUTE: "120"
      AUTH_RATE_LIMIT_PER_MINUTE: "30"
      DB_POOL_SIZE: "15"
      DB_MAX_OVERFLOW: "30"
      SECURE_COOKIES: "False"
      CSRF_PROTECTION_ENABLED: "True"
      ALLOW_DEMO_ACCOUNTS: "True"
      ALLOW_LEGACY_HEADER_AUTH: "False"
      ALLOW_DEFAULT_USER_FALLBACK: "False"
      ENABLE_DOCS_IN_PRODUCTION: "True"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stockpulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: stockpulse-frontend:latest
    container_name: stockpulse-frontend
    restart: always
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stockpulse-net

networks:
  stockpulse-net:
    driver: bridge
